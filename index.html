<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mughseil CRS-001 Review</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2E2F31; --navy:#2F4A5C; --grey:#737476; --soft:#9A9C9F; --line:#DDE1E5; --blue:#BAD8EB; --tint:#EEF5FA;
          --bg:#F4F6F8; --tag:#6B3FA0; --red:#C0392B; --green:#3C7A4E; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Questrial", system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 14.5px;
         display: flex; flex-direction: column; -webkit-text-size-adjust: 100%; }
  button, input, select { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: #fff; border-bottom: 1px solid var(--line); }
  header img { height: 42px; width: auto; }
  header .t1 { font-size: 19px; color: var(--navy); line-height: 1.15; }
  header .t2 { font-size: 13px; color: var(--grey); margin-top: 2px; }
  header .by { margin-left: auto; font-size: 12.5px; color: var(--grey); text-align: right; line-height: 1.35; }

  main { flex: 1; display: grid; grid-template-columns: minmax(360px, 41%) minmax(0, 1fr); min-height: 0; }
  #left { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  #tools { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  #tools input { flex: 1 1 160px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  #tools select { flex: 0 1 200px; min-width: 0; width: 200px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
  .btn { border: 1px solid var(--line); background: #fff; padding: 6px 11px; border-radius: 7px; color: var(--navy); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #b6c3cd; }
  .btn.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  #list { flex: 1; overflow-y: auto; padding: 4px 12px 50vh; }
  .sec { position: sticky; top: 0; background: var(--bg); color: var(--navy); font-size: 12.5px; letter-spacing: .5px; text-transform: uppercase;
         padding: 12px 2px 7px; z-index: 1; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .card { background: #fff; border: 1px solid var(--line); border-left: 4px solid transparent; border-radius: 8px; padding: 11px 14px 12px; margin-bottom: 9px; cursor: pointer; }
  .card:hover { border-color: #c4ced6; border-left-color: var(--blue); }
  .card.on { border-color: var(--navy); border-left-color: var(--navy); box-shadow: 0 2px 10px rgba(47,74,92,.15); }
  .row1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .id { color: var(--tag); font-size: 15px; }
  .loc { color: var(--grey); font-size: 13px; flex: 1; min-width: 150px; }
  .pill { font-size: 11.5px; padding: 1px 9px; border-radius: 10px; border: 1px solid var(--line); color: var(--grey); }
  .pill.Open { color: var(--red); border-color: rgba(192,57,43,.5); }
  .lbl { font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 3px; }
  .txt { line-height: 1.5; }
  .txt p { margin: 0 0 4px; }
  .txt ul { margin: 2px 0 4px; padding-left: 18px; }
  .txt li { margin: 0 0 3px; }
  .reply { background: var(--tint); border-radius: 6px; padding: 8px 11px; }
  .ar { display: block; direction: rtl; text-align: right; font-family: "Geeza Pro", "Noto Naskh Arabic", "Segoe UI", "Al Bayan", sans-serif;
        font-size: 1.05em; margin: 4px 0 2px; }
  .ref { font-size: 12.5px; color: var(--grey); margin-top: 7px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .chip { font-size: 12px; border: 1px solid rgba(107,63,160,.45); color: var(--tag); background: #fff; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .chip:hover { background: #F4EEFA; }
  .chip.none { border-color: var(--line); color: var(--grey); cursor: default; background: transparent; }
  .empty { color: var(--grey); padding: 30px 6px; text-align: center; }
  body.big .card { font-size: 17px; }
  body.big .loc, body.big .ref { font-size: 15px; }

  #right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tabs { display: flex; gap: 5px; padding: 9px 12px; background: #fff; border-bottom: 1px solid var(--line); align-items: center; overflow-x: auto; scrollbar-width: thin; }
  #tabs .btn { padding: 5px 10px; font-size: 13.5px; }
  #tabs .sp { flex: 1; min-width: 6px; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #E6EAEE; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world.anim { transition: transform .45s ease; }
  #world img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; box-shadow: 0 1px 8px rgba(0,0,0,.18); background: #fff; }
  .tag { position: absolute; transform: translate(-50%, -50%) scale(var(--inv, 1)); transform-origin: center; border: 1.5px solid var(--tag); color: var(--tag);
         background: rgba(255,255,255,.62); border-radius: 7px; font: 14px "Questrial", sans-serif; padding: 2px 7px; cursor: pointer; white-space: nowrap; }
  .tag:hover { background: #fff; }
  .tag.on { background: var(--tag); color: #fff; z-index: 2; animation: pulse 1.3s ease 2; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(107,63,160,.55); } 50% { box-shadow: 0 0 0 14px rgba(107,63,160,0); } }
  #cap { position: absolute; left: 10px; bottom: 10px; right: 10px; width: max-content; max-width: calc(100% - 20px); background: rgba(255,255,255,.93);
         border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; font-size: 12.5px; color: var(--grey); pointer-events: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--grey); pointer-events: none; }
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 8px 15px; border-radius: 7px;
           font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  #layer { display: none; }

  @media (max-width: 860px) {
    header { padding: 8px 16px; gap: 10px; }
    header img { height: 34px; }
    header .t1 { font-size: 16px; }
    header .by { display: none; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44vh minmax(0, 1fr); }
    #tools input { flex: 1 1 100%; }
    #tools select { flex: 1 1 auto; width: auto; }
    #right { order: -1; border-bottom: 1px solid var(--line); }
    #left { border-right: 0; }
    #tools, #tabs { padding: 8px 16px; }
    #list { padding: 4px 16px 40vh; }
    .help { display: none; }
  }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Safir Hotels &amp; Resorts">
  <div>
    <div class="t1">Mughseil Hotel Salalah</div>
    <div class="t2">CRS-001 · Safir replies · 26 Oct 2026</div>
  </div>
  <div class="by">Issued by the Design and Technical Services Department<br><span class="help">Click a comment or a tag on the plan · ↑ ↓ for the next comment</span></div>
</header>
<main>
  <section id="left">
    <div id="tools">
      <input id="q" type="search" placeholder="Search, e.g. kitchen, OP-048, 8–9" aria-label="Search comments">
      <select id="sec" aria-label="Show"></select>
      <button class="btn" id="prev" title="Previous comment">‹</button>
      <button class="btn" id="next" title="Next comment">›</button>
      <button class="btn" id="big" title="Larger text">A+</button>
    </div>
    <div id="list"></div>
  </section>
  <section id="right">
    <div id="tabs"></div>
    <div id="stage">
      <div id="world"><img id="img" alt=""></div>
      <div id="loading">Loading the plan…</div>
      <div id="cap"></div>
      <div id="toast"></div>
    </div>
  </section>
</main>
<script>
const DATA = {"items": [{"id": "OP-001", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 5–7 / G–H", "comment": "\"TERRACE\"", "deeb": "It is difficult to separate this area from the main restaurant space and still accommodate the required number of tables and rooms, as eight structural columns sit in the middle of the current layout. The current space is therefore to be retained.", "status": "Closed", "reply": "Outdoor seating is very important for a hotel in this climate, especially from October to February. We recommend adding a terrace and having some seating outside. In the meeting of 11 Oct 2026, it was mentioned that adding a terrace would make the indoor seating too small. However, please consider the following:\n• With 118–119 keys, at about 80% occupancy and 2 guests per room, around 190 guests use the all-day dining at breakfast.\n• Over a 4-hour service with an average stay of 45 minutes, and since not all tables are full at once, peak demand is roughly 70–80 seats, with a maximum of 100 seats.\n• Safir recommends smaller tables (80×80 cm and 80×60 cm) that can be combined and re-arranged for flexibility of setup and better occupancy.", "ref": "", "sheets": [1], "general": false}, {"id": "OP-002", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 5 / F–G", "comment": "\"POOL BAR\"", "deeb": "The bar location will be designed together with the external landscape works, close to the pool.", "status": "Closed", "reply": "Safir recommends a pool bar or F&B service point at this pool, next to the all-day dining, not only at the landscape pool.\n• Oman Hotels Classification Criteria, clause 2-8-2 (four-star): «كما يجب ان تقدم بالقرب من الحوض بعض الاطعمة والمشروبات مع تخصيص عمال مسئولون عن الحوض» (“Some food and drinks must also be served near the pool, with staff assigned to the pool.”).\n• Served near the pool does not mean served from the restaurant. This location is ideal for a pool bar.\n• Further details to be discussed with the consultant.", "ref": "Oman Hotels Classification Criteria, clause 2-8-2 (four-star), page 24", "sheets": [1], "general": false}, {"id": "OP-003", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 1–5 / F–G (buffet / service line)", "comment": "Freehand mark-up along the counter line, no text", "deeb": "The drawings incorporate the bar furniture and its relationship with the kitchen, as per the kitchen consultant's vision.", "status": "Closed", "reply": "Safir suggests rearranging the buffet, with live cooking, as shown on Safir’s kitchen sketch of 26.10.2026 (attached). In this arrangement the kitchen no longer protrudes into the buffet area, which gives easier circulation and a more open space.", "ref": "Safir kitchen sketch of 26.10.2026", "sheets": [1, 10], "general": false}, {"id": "OP-004", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 10–12 / G–H (angled unit)", "comment": "\"BATHROOM\" / \"WC\" with freehand sketch", "deeb": "Adding a WC within the suite would affect the spatial design, so it is preferable not to modify the current layout. In addition, it is not a requirement of the Oman Hotels Classification Criteria (four-star).", "status": "Closed", "reply": "Furniture suggestion: as agreed in the meeting of 11 Oct 2026, Safir’s furniture layout will be considered:\n• Upper level: a master bedroom (king bed).\n• Lower level: twin beds.", "ref": "meeting of 11 Oct 2026", "sheets": [1], "general": false}, {"id": "OP-005", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 10–12 / E–H (units)", "comment": "\"DINING TABLE NEEDED IN ALL THESE UNITS\"", "deeb": "Adding dining tables would impact the current design. In addition, it is not a requirement of the Oman Hotels Classification Criteria (four-star).", "status": "Closed", "reply": "Furniture suggestion: a 4-seat dining table is recommended in the duplex units.\n• These units are labeled suites, with a living area downstairs.\n• Oman Hotels Classification Criteria, clause 3-4-3 (four-star): «ضرورة وجود طاولة طعام من نوعية ممتازة مع 4 مقاعد في جميع الاجنحة والغرف ذات المساحة الواسعة ان كانت ملائمة» (“An excellent-quality dining table with 4 seats is required in all suites and in large rooms, where suitable.”).", "ref": "Oman Hotels Classification Criteria, clause 3-4-3 (four-star), page 36", "sheets": [1], "general": false}, {"id": "OP-006", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 6–8 / D (public toilets)", "comment": "\"BABY CHANGING\"", "deeb": "Baby-changing facility added in the public toilets.", "status": "Closed", "reply": "Baby changing addition noted. Safir recommends rearranging the toilet block (grid 5–8 / C–E) as sketched on Safir’s hand markup of 18.10.2026, so that visitors entering do not face the WCs directly.", "ref": "Safir hand markup of 18.10.2026, grid 5–8 / C–E", "sheets": [1], "general": false}, {"id": "OP-007", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 1–5 / B–E", "comment": "\"WILL BE DONE SEPARATELY\"", "deeb": "The new kitchen layout provided by the kitchen consultant has been drafted into the drawings.", "status": "Closed", "reply": "Safir recommends the kitchen layout shown on Safir’s kitchen sketch of 26.10.2026 (attached), which also covers the buffet (see OP-003):\n• The main kitchen area can be better used by repositioning the corridor between the kitchen and the staircase.\n• The kitchen functions can be rearranged for a more seamless F&B operation.", "ref": "Safir kitchen sketch of 26.10.2026", "sheets": [1, 10], "general": false}, {"id": "OP-008", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 7–8 / A (service entrance)", "comment": "\"ROLLING SHUTTER\"", "deeb": "Understood as: a rolling shutter is requested at the service entrance. Please confirm opening width.", "status": "Open", "reply": "Safir recommends a rolling shutter across the full width of the service entrance opening, as shown on Safir’s kitchen sketch of 26.10.2026 (attached):\n• It closes off the service entrance and receiving area outside delivery hours.\n• It keeps the kitchen and stores secure and protected from heat, dust and pests.\n• The service entrance is visible from both approach roads, so the shutter also screens the service area from the view of guests and passers-by.", "ref": "Safir kitchen sketch of 26.10.2026", "sheets": [1, 10], "general": false}, {"id": "OP-009", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 6–7 / A–B", "comment": "\"SECURITY\" / \"RECEIVING\"", "deeb": "The security room location has already been designated on the layout.", "status": "Closed", "reply": "Safir recommends that the main kitchen is not entered through the security room, as shown on Safir’s kitchen sketch of 26.10.2026 (attached).\n• Safir recommends new doors and a separate, wider entry for the main kitchen in this block (grid 6–8 / A–C).\n• Safir recommends that security overlooks receiving, and suggests showing the receiving area as marked on Safir’s hand markup of 18.10.2026 (grid 6–7 / A).\n• Oman Hotels Classification Criteria, clause 10-2-7 (four-star): «مدخل الموظفين عادة في منطقة استلام التجهيزات و يجب ان يكون قريبا من غرفة الخزانات - على ان يكون دخول وخروج الموظفين تحت اشراف موظف امن» (“The staff entrance is usually in the goods-receiving area and must be close to the locker room, with staff entering and leaving under the supervision of a security officer.”).", "ref": "Oman Hotels Classification Criteria, clause 10-2-7 (four-star), page 68; Safir hand markup of 18.10.2026; Safir kitchen sketch of 26.10.2026", "sheets": [1, 10], "general": false}, {"id": "OP-010", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 9–11 / E–F and 8–9 / G–H (rooms)", "comment": "Freehand furniture sketches, no text", "deeb": "Modifying the furniture layout would impact the design.", "status": "Closed", "reply": "Furniture suggestion: Safir would be glad to advise on the best furniture layout for the hotel at the design stage.", "ref": "", "sheets": [1], "general": false}, {"id": "OP-011", "section": "Basement Floor · Drawing 100", "title": "Basement Floor", "loc": "Grid 9 / B–C (corridor)", "comment": "Freehand marks, no text", "deeb": "Added to the drawings.", "status": "Closed", "reply": "Accepted.", "ref": "", "sheets": [1], "general": false}, {"id": "OP-012", "section": "Mezzanine Floor · Drawing 101", "title": "Mezzanine Floor", "loc": "Grid 10–12 / A–B (room)", "comment": "Freehand sketch over bathroom and bed area with note \"CHANGE FOR ALL\"", "deeb": "Modifying the furniture layout would impact the spatial design.", "status": "Closed", "reply": "Furniture suggestion: as agreed in the meeting of 11 Oct 2026, Safir suggests revising the layout of the beds and the WC entrance doors. Safir’s comments help with operation, maintenance, cleaning and the guest experience. Furniture details can be discussed with the designers at a later stage.", "ref": "Comments v5, page 7; meeting of 11 Oct 2026", "sheets": [2], "general": false}, {"id": "OP-013", "section": "Mezzanine Floor · Drawing 101", "title": "Mezzanine Floor", "loc": "Grid 10–12 / F–H (angled unit)", "comment": "Freehand furniture sketch and cross marks (X) on several elements", "deeb": "Modifying the furniture layout would impact the spatial design.", "status": "Closed", "reply": "Furniture suggestion: as agreed in the meeting of 11 Oct 2026:\n• Upper level: a master bedroom (king bed).\n• Lower level: twin beds.", "ref": "meeting of 11 Oct 2026", "sheets": [2], "general": false}, {"id": "OP-014", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 4 / G–H (circled element)", "comment": "\"TO GO DOWN BY THE POOL\"", "deeb": "As agreed in the meeting, the existing location is to be retained.", "status": "Closed", "reply": "There is too much equipment outside (grid 3–5 / G–H). Safir suggests shifting part of it into the specialty kitchen, to be discussed with the designer.", "ref": "Safir hand markup of 18.10.2026", "sheets": [3], "general": false}, {"id": "OP-015", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 4–5 / G", "comment": "\"OUTSIDE TERRACE SEATING\"", "deeb": "Provided: specialty restaurant outdoor terrace 69 m² and outdoor lounge terrace 83 m².", "status": "Closed", "reply": "Furniture suggestion: tables of 80×80 cm and 80×60 cm are recommended in the specialty restaurant, as marked on Safir’s hand markup of 18.10.2026.", "ref": "Safir hand markup of 18.10.2026", "sheets": [3], "general": false}, {"id": "OP-016", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 6–8 / G", "comment": "\"LOUNGE / EXTERIOR SEATING\" with seating sketch", "deeb": "Lounge / seating added.", "status": "Closed", "reply": "Furniture suggestion: Safir suggests arranging the Lobby furniture as sketched on Safir’s hand markup of 18.10.2026 (grid 7–8 / C–D, 5–6 / E–F and 7–8 / A–C). Furniture details can be discussed with the designers at a later stage.", "ref": "Safir hand markup of 18.10.2026", "sheets": [3], "general": false}, {"id": "OP-017", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 10–12 / G–H (Suite Handicap Rooms)", "comment": "\"TO BE AMENDED FOR EASY WHEELCHAIR CIRCULATION\"", "deeb": "The accessible room has been relocated and integrated with the standard rooms, resulting in four identical guest rooms.", "status": "Closed", "reply": "Rooms for guests with disabilities in the east wing noted.\n• As agreed in the meeting of 11 Oct 2026, Safir recommends wider rooms, with the door opening outwards.\n• Safir suggests arranging the furniture as sketched on Safir’s hand markup of 18.10.2026, with twin beds in the room for guests with disabilities at grid 11–12 / B–C.\n• The rooms for guests with disabilities are 20 m², below the minimum room size. Oman Hotels Classification Criteria, clause 3-1-2 (four-star): «المساحة الدنيا بالمتر المربع باستثناء الحمام، المدخل وخزانة الملابس والشرفة: الحد الأدنى 22متر مربع» (“Minimum room area, excluding the bathroom, entrance, wardrobe and balcony: 22 m².”).", "ref": "Oman Hotels Classification Criteria, clause 3-1-2 (four-star), page 31; meeting of 11 Oct 2026", "sheets": [3], "general": false}, {"id": "OP-018", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 10–12 / E (Handicap Room 20 m²)", "comment": "\"STANDARD ROOM HERE\"", "deeb": "We are required to provide four accessible rooms as per the code (item 3.1.7, four- star).", "status": "Closed", "reply": "Accepted.\n• In line with the Oman Hotels Classification Criteria, clause 3-1-7 (four-star): «عدد غرف ذوي الاحتياجات الخاصة: يجب توفير كحد أدنى ثلاث غرف للستين غرفة الاولى ثم إضافة غرفة اخرى لكل 35 غرفة إضافية» (“Number of rooms for guests with special needs: a minimum of three rooms must be provided for the first 60 rooms, then one more room for every 35 additional rooms.”).", "ref": "Oman Hotels Classification Criteria, clause 3-1-7 (four-star), page 31", "sheets": [3], "general": false}, {"id": "OP-019", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 1–3 / C–D (guest public toilets)", "comment": "\"GENTS\" / \"LADIES\" with freehand re-planning sketch", "deeb": "The current design is preferable because it separates the public toilets from the administration entrance.", "status": "Closed", "reply": "Safir recommends that the door of the WC for guests with disabilities opens outwards.", "ref": "Safir hand markup of 18.10.2026", "sheets": [3], "general": false}, {"id": "OP-020", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 3–4 / B–C", "comment": "\"FRONT OFFICE\"", "deeb": "As clarified in the previous meeting, the existing layout already includes the front- office and back-office facilities.", "status": "Closed", "reply": "Safir’s recommendations for the offices (core staff, offices and spaces for the operator):\n• GM: 1 office and meeting room, 1 secretary place\n• Front office (15 persons): reception; 1 office with 2 desks; 1 manager office\n• Reservations: 1 office with 2 desks\n• Sales: 1 office\n• Finance department: 1 office – manager; 1 office with 4 desks – employees\n• HR department: 1 office – manager; 1 office – 2 employees\n• IT department: 1 office – IT manager; BMS room; server room\n• Purchasing department: 1 receiver and 1 storekeeper (same office); 1 purchase manager office\n• F&B department: 1 office – manager; 1 office – 2 restaurant managers; chef – office in the kitchen; stewarding – next to the stores\n• Engineering: 1 office – chief engineer; 1 office – duty engineer; store\n• Housekeeping: 1 office for the manager, close to the laundry; uniform store\nPlease advise where the additional space for hotel employees will be.\nOman Hotels Classification Criteria, clause 2-1-17 (four-star): «ضرورة وجود مكتب خلفي جيد الأتساع، وخدمات بدالة 24/24» (“A good-sized office behind the reception is required, with 24-hour switchboard services.”).", "ref": "Oman Hotels Classification Criteria, clause 2-1-17 (four-star), page 15; Safir hand markup of 18.10.2026", "sheets": [3], "general": false}, {"id": "OP-021", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 5–6 / A–B", "comment": "\"RECEPTION\" with sketch", "deeb": "Understood as: reception desk position / length to be changed. Please state the requirement.", "status": "Closed", "reply": "The reception desk is acceptable at this stage. Furniture details can be discussed with the designers at a later stage.", "ref": "", "sheets": [3], "general": false}, {"id": "OP-022", "section": "Ground Floor · Drawing 102", "title": "Ground Floor", "loc": "Grid 6–7 / A (hotel entrance)", "comment": "\"VESTIBUL\"", "deeb": "Not a const $ = (s) => document.querySelector(s);
const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const arab = (s) => s.replace(/\s*«([^»]*)»\s*\(“([^”]*)”\)\.?/g, '<span class="ar" lang="ar">«$1»</span>“$2”');
function fmt(s) {                      // lines → paragraphs; "• " lines → a list; Arabic quotes on their own line, English under
  let out = "", ul = false;
  String(s || "").split("\n").filter((l) => l.trim()).forEach((l) => {
    const b = /^\s*•\s*/.test(l), t = arab(esc(l.replace(/^\s*•\s*/, "")));
    if (b && !ul) { out += "<ul>"; ul = true; }
    if (!b && ul) { out += "</ul>"; ul = false; }
    out += b ? `<li>${t}</li>` : `<p>${t}</p>`;
  });
  return out + (ul ? "</ul>" : "");
}
const items = DATA.items, byId = Object.fromEntries(items.map((it) => [it.id, it]));
const SHEETS = DATA.sheets, ORDER = Object.keys(SHEETS).map(Number).sort((a, b) => a - b);
const SEC_SHEET = { "Basement": 1, "Mezzanine": 2, "Ground": 3, "First": 4, "Second": 5, "Third": 6, "Fourth": 7, "Roof": 8, "Typical": 9 };
let cur = { sheet: 0, scale: 1, tx: 0, ty: 0, fit: 1, alt: false }, sel = null;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---------- list ----------
const sections = [...new Set(items.map((it) => it.section))];
$("#sec").innerHTML = `<option value="">All comments</option>` + sections.map((s) => `<option>${esc(s)}</option>`).join("");
function renderList() {
  const q = $("#q").value.trim().toLowerCase(), sec = $("#sec").value;
  const L = $("#list"); L.innerHTML = "";
  let last = null, n = 0;
  items.forEach((it) => {
    if (sec && it.section !== sec) return;
    if (q && ![it.id, it.title, it.loc, it.comment, it.deeb, it.reply, it.ref].join(" ").toLowerCase().includes(q)) return;
    n++;
    if (it.section !== last) { last = it.section; L.insertAdjacentHTML("beforeend", `<div class="sec">${esc(it.section)}</div>`); }
    const chips = it.sheets.length ? it.sheets.map((s) => `<button class="chip" data-s="${s}">Show on the ${esc(SHEETS[s].chip)}</button>`).join("")
      : `<span class="chip none">${it.general ? "All floors" : "Not marked on the plans"}</span>`;
    const c = document.createElement("article");
    c.className = "card" + (sel === it.id ? " on" : ""); c.id = "c-" + it.id;
    c.innerHTML = `<div class="row1"><span class="id">${it.id}</span><span class="loc">${esc(it.title)} · ${esc(it.loc)}</span>${it.status ? `<span class="pill ${esc(it.status)}" title="DEEB status">${esc(it.status)}</span>` : ""}</div>
      ${it.comment ? `<div class="lbl">Comment (as received)</div><div class="txt">${fmt(it.comment)}</div>` : ""}
      ${it.deeb ? `<div class="lbl">DEEB response</div><div class="txt">${fmt(it.deeb)}</div>` : ""}
      <div class="lbl">Safir reply</div><div class="txt reply">${fmt(it.reply)}</div>
      ${it.ref ? `<div class="ref">Reference: ${esc(it.ref)}</div>` : ""}
      <div class="chips">${chips}</div>`;
    c.addEventListener("click", (e) => { const ch = e.target.closest(".chip[data-s]"); select(it.id, "list", ch ? +ch.dataset.s : null); });
    L.append(c);
  });
  if (!n) L.innerHTML = `<div class="empty">No comments match.</div>`;
}

// ---------- plan ----------
const stage = $("#stage"), world = $("#world"), img = $("#img");
function apply(anim) {
  world.classList.toggle("anim", !!anim);
  world.style.transform = `translate(${cur.tx}px, ${cur.ty}px) scale(${cur.scale})`;
  world.style.setProperty("--inv", 1 / cur.scale);
}
function fitSheet(anim) {
  const s = SHEETS[cur.sheet], r = stage.getBoundingClientRect();
  if (!s || !r.width) return;
  cur.fit = Math.min(r.width / s.w, r.height / s.h) * 0.96;
  cur.scale = cur.fit; cur.tx = (r.width - s.w * cur.scale) / 2; cur.ty = (r.height - s.h * cur.scale) / 2;
  apply(anim);
}
function setImage() {
  const s = SHEETS[cur.sheet], src = cur.alt && s.alt ? s.alt : s.img;
  if (img.getAttribute("src") === src) return;
  $("#loading").style.display = "flex";
  img.onload = () => ($("#loading").style.display = "none");
  img.src = src;
  $("#cap").textContent = cur.alt && s.name_alt ? s.name_alt : s.name;
}
function showSheet(n, keepView) {
  if (cur.sheet === n) { if (!keepView) fitSheet(true); return; }
  cur.sheet = n; const s = SHEETS[n];
  img.width = s.w; img.height = s.h; setImage();
  world.querySelectorAll(".tag").forEach((t) => t.remove());
  s.tags.forEach(([id, x, y]) => {
    const b = document.createElement("button");
    b.className = "tag" + (id === sel ? " on" : ""); b.textContent = id; b.dataset.id = id;
    b.style.left = x * s.w + "px"; b.style.top = y * s.h + "px";
    b.addEventListener("pointerdown", (e) => e.stopPropagation());
    b.addEventListener("click", (e) => { e.stopPropagation(); select(id, "plan"); });
    world.append(b);
  });
  document.querySelectorAll("#tabs .btn[data-s]").forEach((b) => b.classList.toggle("on", +b.dataset.s === n));
  const lay = $("#layer"); lay.style.display = s.alt ? "inline-block" : "none"; lay.classList.toggle("on", !cur.alt);
  if (!keepView) fitSheet(false);
}
function zoomTo(id) {
  const s = SHEETS[cur.sheet], p = s.tags.filter((t) => t[0] === id);
  if (!p.length) return;
  const r = stage.getBoundingClientRect(), xs = p.map((t) => t[1] * s.w), ys = p.map((t) => t[2] * s.h);
  const pad = Math.max(s.w, s.h) * 0.09, bw = Math.max(...xs) - Math.min(...xs) + pad * 2, bh = Math.max(...ys) - Math.min(...ys) + pad * 2;
  cur.scale = Math.max(cur.fit * 1.3, Math.min(r.width / bw, r.height / bh, cur.fit * (s.zoom || 3.5)));
  cur.tx = r.width / 2 - (Math.max(...xs) + Math.min(...xs)) / 2 * cur.scale;
  cur.ty = r.height / 2 - (Math.max(...ys) + Math.min(...ys)) / 2 * cur.scale;
  apply(true);
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => (el.style.opacity = 0), 2400); }

function select(id, from, sheet) {
  sel = id; const it = byId[id];
  history.replaceState(null, "", "#" + id);
  document.querySelectorAll(".card.on").forEach((c) => c.classList.remove("on"));
  const card = document.getElementById("c-" + id);
  if (card) { card.classList.add("on"); if (from !== "list") card.scrollIntoView(from === "link" ? { block: "start" } : { block: from === "plan" ? "center" : "nearest", behavior: "smooth" }); }
  if (!it.sheets.length) {
    world.querySelectorAll(".tag").forEach((t) => t.classList.remove("on"));
    toast(it.general ? id + " applies to all floors" : id + " is not marked on the plans");
    return;
  }
  const target = sheet || (it.sheets.includes(cur.sheet) ? cur.sheet : it.sheets[0]);
  showSheet(target, true);
  world.querySelectorAll(".tag").forEach((t) => t.classList.toggle("on", t.dataset.id === id));
  zoomTo(id);
}

// pan and zoom: mouse wheel, drag, two-finger pinch
const clampS = (s) => Math.min(cur.fit * 14, Math.max(cur.fit * 0.6, s));
function zoomAt(mx, my, ns, anim) { cur.tx = mx - (mx - cur.tx) * (ns / cur.scale); cur.ty = my - (my - cur.ty) * (ns / cur.scale); cur.scale = ns; apply(anim); }
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, clampS(cur.scale * Math.exp(-e.deltaY * 0.0016)), false);
}, { passive: false });
const ptrs = new Map(); let drag = null, pinch = null;
function begin() {
  const p = [...ptrs.values()];
  if (p.length === 1) { drag = { x: p[0].x, y: p[0].y, tx: cur.tx, ty: cur.ty }; pinch = null; }
  else if (p.length >= 2) { pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2, s: cur.scale, tx: cur.tx, ty: cur.ty }; drag = null; }
  else { drag = pinch = null; }
}
stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.classList.add("drag"); begin(); });
stage.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const p = [...ptrs.values()], r = stage.getBoundingClientRect();
  if (pinch && p.length >= 2) {
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), ns = clampS(pinch.s * d / pinch.d);
    const m0x = pinch.mx - r.left, m0y = pinch.my - r.top, m1x = (p[0].x + p[1].x) / 2 - r.left, m1y = (p[0].y + p[1].y) / 2 - r.top;
    cur.tx = m1x - (m0x - pinch.tx) * (ns / pinch.s); cur.ty = m1y - (m0y - pinch.ty) * (ns / pinch.s); cur.scale = ns; apply(false);
  } else if (drag) { cur.tx = drag.tx + p[0].x - drag.x; cur.ty = drag.ty + p[0].y - drag.y; apply(false); }
});
const end = (e) => { ptrs.delete(e.pointerId); if (!ptrs.size) stage.classList.remove("drag"); begin(); };
stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
window.addEventListener("resize", () => { const was = cur.sheet; cur.sheet = 0; showSheet(was); if (sel && SHEETS[was].tags.some((t) => t[0] === sel)) zoomTo(sel); });

// plan tabs, kitchen layer, zoom buttons
const tabs = $("#tabs");
ORDER.forEach((n) => { const b = Object.assign(document.createElement("button"), { className: "btn", textContent: SHEETS[n].short }); b.dataset.s = n; b.addEventListener("click", () => showSheet(n)); tabs.append(b); });
tabs.append(Object.assign(document.createElement("span"), { className: "sp" }));
const lay = Object.assign(document.createElement("button"), { className: "btn on", id: "layer", textContent: "DEEB plan", title: "Show or hide DEEB’s plan under the sketch" });
lay.addEventListener("click", () => { cur.alt = !cur.alt; lay.classList.toggle("on", !cur.alt); setImage(); }); tabs.append(lay);
[["−", 1 / 1.4, "Zoom out"], ["+", 1.4, "Zoom in"]].forEach(([t, k, title]) => {
  const b = Object.assign(document.createElement("button"), { className: "btn", textContent: t, title });
  b.addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, clampS(cur.scale * k), true); }); tabs.append(b);
});
const fb = Object.assign(document.createElement("button"), { className: "btn", textContent: "Whole sheet" }); fb.addEventListener("click", () => fitSheet(true)); tabs.append(fb);

// stepping through comments: ‹ › buttons and ↑ ↓ keys
function step(d) {
  const cards = [...document.querySelectorAll(".card")]; if (!cards.length) return;
  const i = cards.findIndex((c) => c.id === "c-" + sel);
  const n = cards[i < 0 ? 0 : Math.max(0, Math.min(cards.length - 1, i + d))];
  select(n.id.slice(2), "keys");
}
$("#prev").addEventListener("click", () => step(-1)); $("#next").addEventListener("click", () => step(1));
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT"].includes(e.target.tagName) || !["ArrowDown", "ArrowUp"].includes(e.key)) return;
  e.preventDefault(); step(e.key === "ArrowDown" ? 1 : -1);
});
$("#q").addEventListener("input", renderList);
$("#sec").addEventListener("change", () => {
  renderList();
  const k = Object.keys(SEC_SHEET).find((w) => $("#sec").value.startsWith(w));
  if (k) showSheet(SEC_SHEET[k]);
  $("#list").scrollTop = 0;
});
const big = $("#big");
big.addEventListener("click", () => { document.body.classList.toggle("big"); big.classList.toggle("on"); store.set("crs-big", document.body.classList.contains("big") ? "1" : ""); });
if (store.get("crs-big")) { document.body.classList.add("big"); big.classList.add("on"); }

renderList();
showSheet(1);
const start = decodeURIComponent(location.hash.slice(1));      // e.g. …/#OP-017 opens straight on that comment
if (byId[start]) select(start, "link");
</script>
